name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libssl-dev pkg-config \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev \
            libasound2-dev \
            cmake build-essential libclang-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libssl-dev pkg-config \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev \
            libasound2-dev \
            cmake build-essential libclang-dev
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release

  build-unicorn:
    name: build with unicorn-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config libclang-dev \
            libasound2-dev
      - name: build pocket-cli with unicorn feature
        run: cargo build --release -p pocket-cli --features unicorn

  build-linux:
    name: build linux release artifacts
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libssl-dev pkg-config \
            libwayland-dev libx11-dev libxcb1-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxcursor-dev libxdamage-dev libxext-dev libxfixes-dev \
            libasound2-dev \
            cmake build-essential libclang-dev
      - name: build CLI + desktop (with unicorn-engine)
        run: |
          cargo build --release -p pocket-cli --features unicorn
          cargo build --release -p pocket-desktop
      - name: stage artifacts
        run: |
          mkdir -p dist/PocketHLE-linux
          cp target/release/pockethle dist/PocketHLE-linux/
          cp target/release/pockethle-gui dist/PocketHLE-linux/
          cp README.md dist/PocketHLE-linux/
          cp -f README.ru.md dist/PocketHLE-linux/ 2>/dev/null || true
          tar -C dist -czf PocketHLE-linux-x86_64.tar.gz PocketHLE-linux
      - uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-linux-x86_64
          path: PocketHLE-linux-x86_64.tar.gz

  build-windows:
    name: build windows release artifacts
    runs-on: windows-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: build CLI + desktop
        shell: bash
        run: |
          cargo build --release -p pocket-cli
          cargo build --release -p pocket-desktop
      - name: stage artifacts
        shell: bash
        run: |
          mkdir -p dist/PocketHLE-windows
          cp target/release/pockethle.exe dist/PocketHLE-windows/
          cp target/release/pockethle-gui.exe dist/PocketHLE-windows/
          cp README.md dist/PocketHLE-windows/
          cp -f README.ru.md dist/PocketHLE-windows/ 2>/dev/null || true
      - name: zip artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PocketHLE-windows/* -DestinationPath PocketHLE-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-windows-x86_64
          path: PocketHLE-windows-x86_64.zip

  build-wasm:
    name: build web (WebAssembly)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: build pocket-wasm the way the site is built
        env:
          EXTRA_RUSTFLAGS: -D warnings
        run: frontends/pocket-wasm/build.sh

  # The same configuration the release ships: the interpreter backend
  # (no Unicorn), arm64 and x86_64, a release build. CI has no signing key,
  # so the APK here is unsigned; it only proves the build.
  build-android:
    name: build android APK
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true
      - name: install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: cross-compile native lib (interpreter backend)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_PROFILE_RELEASE_DEBUG: '0'
          CARGO_PROFILE_RELEASE_STRIP: 'true'
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o frontends/pocket-android/app/src/main/jniLibs \
            build --release -p pocket-android-jni --no-default-features
      # The Gradle wrapper is committed (frontends/pocket-android/gradlew, gradle/wrapper/),
      # and the Gradle distribution it names is cached by its properties file, so a run
      # downloads Gradle only when the version changes. Before this, every run generated
      # a wrapper and downloaded Gradle 8.7 from GitHub releases, and the Android build
      # failed whenever GitHub answered that download with HTTP 504.
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('frontends/pocket-android/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: gradle/actions/setup-gradle@v3
      - name: build APK
        working-directory: frontends/pocket-android
        run: |
          # Fill the cache once. The official URL redirects to GitHub releases, which
          # has been answering with HTTP 504 or timing out; if it fails, fetch the same
          # file from a mirror. The wrapper checks distributionSha256Sum (the official
          # value), so a different file from the mirror is rejected, never used.
          if ! ./gradlew --version --no-daemon; then
            sed -i 's#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip#' gradle/wrapper/gradle-wrapper.properties
            ./gradlew --version --no-daemon
          fi
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-android
          path: frontends/pocket-android/app/build/outputs/apk/release/*.apk
